<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>⚽ 축구 승부차기 미니게임</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 50px;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            background:
                radial-gradient(
                    circle at 50% 110%,
                    rgba(42, 255, 133, 0.35),
                    transparent 45%
                ),
                linear-gradient(
                    135deg,
                    #06152f 0%,
                    #174f7a 38%,
                    #08724d 72%,
                    #063a2b 100%
                );
            background-size: 150% 150%;
            animation: backgroundMove 8s ease-in-out infinite alternate;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            background:
                radial-gradient(
                    ellipse at 10% 0%,
                    rgba(255, 255, 255, 0.45),
                    transparent 27%
                ),
                radial-gradient(
                    ellipse at 90% 0%,
                    rgba(255, 255, 255, 0.4),
                    transparent 27%
                ),
                conic-gradient(
                    from 205deg at 10% 0%,
                    transparent 0deg 25deg,
                    rgba(113, 216, 255, 0.2) 26deg 44deg,
                    transparent 45deg 360deg
                ),
                conic-gradient(
                    from 135deg at 90% 0%,
                    transparent 0deg 25deg,
                    rgba(113, 216, 255, 0.2) 26deg 44deg,
                    transparent 45deg 360deg
                );
            animation: spotlightMove 5s ease-in-out infinite alternate;
        }

        body::after {
            content: "";
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 45%;
            z-index: -1;
            opacity: 0.45;
            pointer-events: none;
            background:
                radial-gradient(
                    circle,
                    rgba(255, 255, 255, 0.7) 0 1px,
                    transparent 2px
                )
                0 0 / 18px 18px,
                linear-gradient(
                    to top,
                    rgba(0, 0, 0, 0.65),
                    transparent
                );
            animation: crowdMove 12s linear infinite;
        }

        @keyframes backgroundMove {
            from {
                background-position: 0% 40%;
            }

            to {
                background-position: 100% 60%;
            }
        }

        @keyframes spotlightMove {
            from {
                transform: translateX(-2%) scale(1);
                filter: brightness(0.9);
            }

            to {
                transform: translateX(2%) scale(1.08);
                filter: brightness(1.2);
            }
        }

        @keyframes crowdMove {
            from {
                background-position: 0 0, 0 0;
            }

            to {
                background-position: 36px 18px, 0 0;
            }
        }

        header {
            padding: 30px 20px 15px;
        }

        header h1 {
            margin-bottom: 10px;
            font-size: 38px;
            text-shadow:
                0 4px 8px rgba(0, 0, 0, 0.5),
                0 0 20px rgba(120, 220, 255, 0.4);
        }

        header p {
            color: #f1f1f1;
            font-size: 17px;
        }

        .game-container {
            width: 90%;
            max-width: 850px;
            margin: 20px auto 50px;
            padding: 25px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(9px);
            box-shadow:
                0 18px 45px rgba(0, 0, 0, 0.45),
                0 0 30px rgba(72, 216, 255, 0.2);
            animation: containerFloat 4s ease-in-out infinite;
        }

        @keyframes containerFloat {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .score-item {
            min-width: 150px;
            padding: 15px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.48);
            box-shadow: 0 7px 15px rgba(0, 0, 0, 0.25);
        }

        .score-item span {
            display: block;
            margin-top: 8px;
            color: #ffe66d;
            font-size: 27px;
            font-weight: bold;
        }

        .field {
            position: relative;
            width: 100%;
            height: 480px;
            overflow: hidden;
            border: 5px solid rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            background:
                radial-gradient(
                    circle at 50% 10%,
                    rgba(255, 255, 255, 0.25),
                    transparent 30%
                ),
                linear-gradient(
                    to bottom,
                    rgba(8, 31, 62, 0.9) 0 17%,
                    transparent 35%
                ),
                repeating-linear-gradient(
                    90deg,
                    #2fa64b 0,
                    #2fa64b 80px,
                    #238f3e 80px,
                    #238f3e 160px
                );
            box-shadow:
                inset 0 0 70px rgba(0, 0, 0, 0.38),
                0 0 30px rgba(107, 241, 255, 0.28);
            animation: fieldGlow 3.5s ease-in-out infinite alternate;
        }

        .field::before {
            content: "";
            position: absolute;
            inset: -40% -25%;
            z-index: 1;
            pointer-events: none;
            background:
                linear-gradient(
                    115deg,
                    transparent 36%,
                    rgba(255, 255, 255, 0.25) 48%,
                    transparent 60%
                );
            animation: fieldLight 5s linear infinite;
        }

        .field::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(
                    circle at 20% 20%,
                    white 0 1px,
                    transparent 2px
                ),
                radial-gradient(
                    circle at 75% 30%,
                    #fff4a3 0 1px,
                    transparent 2px
                ),
                radial-gradient(
                    circle at 55% 75%,
                    white 0 1px,
                    transparent 2px
                );
            background-size:
                90px 90px,
                120px 110px,
                70px 100px;
            opacity: 0.55;
            animation: particleMove 10s linear infinite;
        }

        @keyframes fieldGlow {
            from {
                filter: brightness(0.95) saturate(1);
            }

            to {
                filter: brightness(1.08) saturate(1.18);
            }
        }

        @keyframes fieldLight {
            from {
                transform: translateX(-60%) rotate(-5deg);
            }

            to {
                transform: translateX(60%) rotate(-5deg);
            }
        }

        @keyframes particleMove {
            from {
                background-position:
                    0 0,
                    0 0,
                    0 0;
            }

            to {
                background-position:
                    90px 90px,
                    -120px 110px,
                    70px -100px;
            }
        }

        .center-line {
            position: absolute;
            top: 0;
            left: 50%;
            z-index: 2;
            width: 4px;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            transform: translateX(-50%);
        }

        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 2;
            width: 130px;
            height: 130px;
            border: 4px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .goal {
            position: absolute;
            top: 35px;
            left: 50%;
            z-index: 3;
            width: 390px;
            height: 175px;
            border: 9px solid white;
            border-bottom-width: 5px;
            transform: translateX(-50%);
            background:
                linear-gradient(
                    90deg,
                    transparent 24%,
                    rgba(255, 255, 255, 0.35) 25%,
                    transparent 26%,
                    transparent 49%,
                    rgba(255, 255, 255, 0.35) 50%,
                    transparent 51%,
                    transparent 74%,
                    rgba(255, 255, 255, 0.35) 75%,
                    transparent 76%
                ),
                linear-gradient(
                    transparent 24%,
                    rgba(255, 255, 255, 0.35) 25%,
                    transparent 26%,
                    transparent 49%,
                    rgba(255, 255, 255, 0.35) 50%,
                    transparent 51%,
                    transparent 74%,
                    rgba(255, 255, 255, 0.35) 75%,
                    transparent 76%
                );
            box-shadow:
                0 0 15px rgba(255, 255, 255, 0.7),
                inset 0 0 20px rgba(0, 0, 0, 0.25);
        }

        .shoot-zone {
            position: absolute;
            top: 0;
            z-index: 4;
            width: 33.33%;
            height: 100%;
            cursor: pointer;
            transition: background 0.2s;
        }

        .shoot-zone:hover {
            background: rgba(255, 230, 109, 0.27);
        }

        .left-zone {
            left: 0;
        }

        .center-zone {
            left: 33.33%;
        }

        .right-zone {
            right: 0;
        }

        /* 사람 골키퍼 */

        .goalkeeper {
            position: absolute;
            top: 105px;
            left: 50%;
            z-index: 6;
            width: 120px;
            height: 170px;
            pointer-events: none;
            user-select: none;
            transform: translateX(-50%);
            transition:
                left 0.55s cubic-bezier(0.2, 0.8, 0.2, 1),
                transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .keeper-shadow {
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 100px;
            height: 20px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.35);
            filter: blur(3px);
            transform: translateX(-50%);
            transition: 0.55s;
        }

        .keeper-person {
            position: absolute;
            left: 50%;
            bottom: 8px;
            width: 82px;
            height: 150px;
            filter: drop-shadow(0 9px 7px rgba(0, 0, 0, 0.45));
            transform: translateX(-50%);
            transform-origin: 50% 78%;
            transition: transform 0.55s;
        }

        .keeper-head {
            position: absolute;
            top: 3px;
            left: 50%;
            z-index: 5;
            width: 34px;
            height: 38px;
            border: 2px solid rgba(70, 35, 20, 0.35);
            border-radius: 48% 48% 45% 45%;
            background: #f0b37e;
            transform: translateX(-50%);
        }

        .keeper-head::before,
        .keeper-head::after {
            content: "";
            position: absolute;
            top: 18px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #2c1a12;
        }

        .keeper-head::before {
            left: 8px;
        }

        .keeper-head::after {
            right: 8px;
        }

        .keeper-hair {
            position: absolute;
            top: -3px;
            left: -2px;
            width: 34px;
            height: 15px;
            border-radius: 55% 55% 35% 35%;
            background: #23150f;
            transform: rotate(-4deg);
        }

        .keeper-body {
            position: absolute;
            top: 36px;
            left: 50%;
            z-index: 4;
            width: 52px;
            height: 64px;
            border: 3px solid #ffe08a;
            border-radius: 14px 14px 11px 11px;
            background: linear-gradient(135deg, #ffb703, #fb8500);
            transform: translateX(-50%);
        }

        .keeper-number {
            position: absolute;
            top: 50%;
            left: 50%;
            color: #1f3145;
            font-size: 27px;
            font-weight: 900;
            transform: translate(-50%, -50%);
        }

        .keeper-arm {
            position: absolute;
            top: 43px;
            z-index: 3;
            width: 18px;
            height: 65px;
            border: 2px solid rgba(80, 43, 20, 0.28);
            border-radius: 12px;
            background:
                linear-gradient(
                    #fb8500 0 55%,
                    #f0b37e 55% 100%
                );
            transform-origin: top center;
            transition: transform 0.55s;
        }

        .keeper-arm-left {
            left: 7px;
            transform: rotate(38deg);
        }

        .keeper-arm-right {
            right: 7px;
            transform: rotate(-38deg);
        }

        .keeper-glove {
            position: absolute;
            left: 50%;
            bottom: -8px;
            width: 25px;
            height: 21px;
            border: 3px solid #caf0f8;
            border-radius: 45% 45% 55% 55%;
            background: #00b4d8;
            transform: translateX(-50%);
        }

        .keeper-glove::before {
            content: "";
            position: absolute;
            top: -7px;
            left: 3px;
            width: 5px;
            height: 12px;
            border-radius: 5px;
            background: #00b4d8;
            box-shadow:
                6px -2px 0 #00b4d8,
                12px 0 0 #00b4d8;
        }

        .keeper-leg {
            position: absolute;
            top: 94px;
            z-index: 2;
            width: 20px;
            height: 55px;
            border: 2px solid rgba(10, 25, 45, 0.35);
            border-radius: 11px;
            background:
                linear-gradient(
                    #173f5f 0 72%,
                    #f0b37e 72% 100%
                );
            transform-origin: top center;
            transition: transform 0.55s;
        }

        .keeper-leg-left {
            left: 25px;
            transform: rotate(11deg);
        }

        .keeper-leg-right {
            right: 25px;
            transform: rotate(-11deg);
        }

        .keeper-boot {
            position: absolute;
            bottom: -5px;
            width: 29px;
            height: 13px;
            border-radius: 10px 13px 4px 4px;
            background: #101820;
        }

        .keeper-leg-left .keeper-boot {
            right: 2px;
        }

        .keeper-leg-right .keeper-boot {
            left: 2px;
        }

        .keeper-center .keeper-person {
            animation: keeperReady 1.1s ease-in-out infinite;
        }

        .keeper-left {
            left: 31%;
            transform:
                translateX(-50%)
                rotate(-17deg)
                scale(1.04);
        }

        .keeper-left .keeper-person {
            transform:
                translateX(-50%)
                rotate(-48deg)
                scale(1.03);
        }

        .keeper-left .keeper-arm-left {
            transform: rotate(105deg);
        }

        .keeper-left .keeper-arm-right {
            transform: rotate(70deg);
        }

        .keeper-left .keeper-leg-left {
            transform: rotate(48deg);
        }

        .keeper-left .keeper-leg-right {
            transform: rotate(22deg);
        }

        .keeper-right {
            left: 69%;
            transform:
                translateX(-50%)
                rotate(17deg)
                scale(1.04);
        }

        .keeper-right .keeper-person {
            transform:
                translateX(-50%)
                rotate(48deg)
                scale(1.03);
        }

        .keeper-right .keeper-arm-left {
            transform: rotate(-70deg);
        }

        .keeper-right .keeper-arm-right {
            transform: rotate(-105deg);
        }

        .keeper-right .keeper-leg-left {
            transform: rotate(-22deg);
        }

        .keeper-right .keeper-leg-right {
            transform: rotate(-48deg);
        }

        .keeper-left .keeper-shadow,
        .keeper-right .keeper-shadow {
            width: 120px;
            opacity: 0.22;
            transform: translateX(-50%) scaleX(1.15);
        }

        @keyframes keeperReady {
            0%,
            100% {
                transform:
                    translateX(-50%)
                    translateY(0);
            }

            50% {
                transform:
                    translateX(-50%)
                    translateY(4px)
                    scaleY(0.98);
            }
        }

        .ball {
            position: absolute;
            left: 50%;
            bottom: 45px;
            z-index: 7;
            font-size: 67px;
            cursor: pointer;
            user-select: none;
            filter: drop-shadow(0 8px 5px rgba(0, 0, 0, 0.4));
            transform: translateX(-50%);
            transition:
                left 0.65s ease,
                bottom 0.65s ease,
                transform 0.65s ease;
            animation: ballBounce 1.2s ease-in-out infinite;
        }

        .ball:hover {
            filter:
                drop-shadow(0 8px 5px rgba(0, 0, 0, 0.4))
                brightness(1.2);
        }

        @keyframes ballBounce {
            0%,
            100% {
                transform:
                    translateX(-50%)
                    translateY(0);
            }

            50% {
                transform:
                    translateX(-50%)
                    translateY(-9px);
            }
        }

        .shoot-left {
            left: 37%;
            bottom: 285px;
            animation: none;
            transform:
                translateX(-50%)
                scale(0.55)
                rotate(-360deg);
        }

        .shoot-center {
            left: 50%;
            bottom: 285px;
            animation: none;
            transform:
                translateX(-50%)
                scale(0.55)
                rotate(-360deg);
        }

        .shoot-right {
            left: 63%;
            bottom: 285px;
            animation: none;
            transform:
                translateX(-50%)
                scale(0.55)
                rotate(360deg);
        }

        .message {
            min-height: 55px;
            margin-top: 22px;
            color: #fff4a3;
            font-size: 23px;
            font-weight: bold;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .controls {
            margin-top: 5px;
        }

        button {
            margin: 7px;
            padding: 13px 25px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
        }

        button:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 7px 13px rgba(0, 0, 0, 0.25);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
            transform: none;
        }

        .start-button {
            color: #222;
            background: #ffe66d;
        }

        .reset-button {
            color: #222;
            background: white;
        }

        .guide {
            margin-top: 18px;
            color: #eeeeee;
            line-height: 1.7;
        }

        .goal-text {
            position: fixed;
            top: 45%;
            left: 50%;
            z-index: 100;
            color: #ffe66d;
            font-size: 80px;
            font-weight: bold;
            pointer-events: none;
            transform: translate(-50%, -50%);
            text-shadow:
                4px 4px 0 #e63946,
                8px 8px 15px rgba(0, 0, 0, 0.45);
            animation: goalEffect 1.2s forwards;
        }

        @keyframes goalEffect {
            0% {
                opacity: 0;
                transform:
                    translate(-50%, -50%)
                    scale(0.3);
            }

            40% {
                opacity: 1;
                transform:
                    translate(-50%, -50%)
                    scale(1.25);
            }

            100% {
                opacity: 0;
                transform:
                    translate(-50%, -70%)
                    scale(1);
            }
        }

        .save-text {
            position: fixed;
            top: 45%;
            left: 50%;
            z-index: 100;
            color: #70e1f5;
            font-size: 65px;
            font-weight: bold;
            pointer-events: none;
            transform: translate(-50%, -50%);
            text-shadow:
                3px 3px 0 #173f5f,
                7px 7px 15px rgba(0, 0, 0, 0.45);
            animation: saveEffect 1s forwards;
        }

        @keyframes saveEffect {
            0% {
                opacity: 0;
                transform:
                    translate(-50%, -50%)
                    scale(0.5);
            }

            45% {
                opacity: 1;
                transform:
                    translate(-50%, -50%)
                    scale(1.15);
            }

            100% {
                opacity: 0;
                transform:
                    translate(-50%, -55%)
                    scale(0.9);
            }
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 28px;
            }

            .game-container {
                width: 95%;
                padding: 14px;
            }

            .field {
                height: 430px;
            }

            .goal {
                width: 88%;
                height: 165px;
            }

            .goalkeeper {
                top: 108px;
                transform:
                    translateX(-50%)
                    scale(0.88);
            }

            .keeper-left {
                left: 29%;
                transform:
                    translateX(-50%)
                    rotate(-17deg)
                    scale(0.9);
            }

            .keeper-right {
                left: 71%;
                transform:
                    translateX(-50%)
                    rotate(17deg)
                    scale(0.9);
            }

            .ball {
                font-size: 58px;
            }

            .score-item {
                min-width: 105px;
                padding: 12px;
            }

            .goal-text {
                font-size: 55px;
            }

            .save-text {
                font-size: 45px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>⚽ 승부차기 챌린지</h1>
    <p>사람 골키퍼를 피해 멋진 골을 넣어보세요!</p>
</header>

<main class="game-container">

    <section class="score-board">
        <div class="score-item">
            ⚽ 점수
            <span id="score">0</span>
        </div>

        <div class="score-item">
            ❤️ 남은 기회
            <span id="life">5</span>
        </div>

        <div class="score-item">
            🏆 최고 점수
            <span id="bestScore">0</span>
        </div>
    </section>

    <section class="field">

        <div class="center-line"></div>
        <div class="center-circle"></div>

        <div class="goal">
            <div
                class="shoot-zone left-zone"
                onclick="shoot('left')"
                title="왼쪽으로 슛"
            ></div>

            <div
                class="shoot-zone center-zone"
                onclick="shoot('center')"
                title="가운데로 슛"
            ></div>

            <div
                class="shoot-zone right-zone"
                onclick="shoot('right')"
                title="오른쪽으로 슛"
            ></div>
        </div>

        <div
            id="goalkeeper"
            class="goalkeeper keeper-center"
            role="img"
            aria-label="사람 골키퍼"
        >
            <div class="keeper-shadow"></div>

            <div class="keeper-person">
                <div class="keeper-head">
                    <div class="keeper-hair"></div>
                </div>

                <div class="keeper-body">
                    <span class="keeper-number">1</span>
                </div>

                <div class="keeper-arm keeper-arm-left">
                    <span class="keeper-glove"></span>
                </div>

                <div class="keeper-arm keeper-arm-right">
                    <span class="keeper-glove"></span>
                </div>

                <div class="keeper-leg keeper-leg-left">
                    <span class="keeper-boot"></span>
                </div>

                <div class="keeper-leg keeper-leg-right">
                    <span class="keeper-boot"></span>
                </div>
            </div>
        </div>

        <div
            id="ball"
            class="ball"
            onclick="selectBall()"
        >
            ⚽
        </div>

    </section>

    <div id="message" class="message">
        게임 시작 버튼을 눌러주세요!
    </div>

    <div class="controls">
        <button
            id="startButton"
            class="start-button"
            onclick="startGame()"
        >
            ▶ 게임 시작
        </button>

        <button
            class="reset-button"
            onclick="resetGame()"
        >
            🔄 초기화
        </button>
    </div>

    <div class="guide">
        ① 게임 시작 버튼을 누릅니다.<br>
        ② 축구공을 클릭합니다.<br>
        ③ 골대의 왼쪽·가운데·오른쪽 중 하나를 클릭합니다.
    </div>

</main>

<script>
    let score = 0;
    let life = 5;

    let bestScore =
        Number(localStorage.getItem("soccerBestScore")) || 0;

    let gameStarted = false;
    let ballSelected = false;
    let isShooting = false;

    const scoreElement =
        document.getElementById("score");

    const lifeElement =
        document.getElementById("life");

    const bestScoreElement =
        document.getElementById("bestScore");

    const messageElement =
        document.getElementById("message");

    const goalkeeper =
        document.getElementById("goalkeeper");

    const ball =
        document.getElementById("ball");

    const startButton =
        document.getElementById("startButton");

    bestScoreElement.innerText = bestScore;

    function startGame() {
        score = 0;
        life = 5;

        gameStarted = true;
        ballSelected = false;
        isShooting = false;

        scoreElement.innerText = score;
        lifeElement.innerText = life;

        messageElement.innerText =
            "⚽ 축구공을 클릭한 뒤 슛 방향을 선택하세요!";

        startButton.innerText = "게임 진행 중";
        startButton.disabled = true;

        resetPosition();
    }

    function selectBall() {
        if (!gameStarted) {
            messageElement.innerText =
                "먼저 게임 시작 버튼을 눌러주세요!";

            return;
        }

        if (isShooting) {
            return;
        }

        ballSelected = true;

        messageElement.innerText =
            "🔥 골대의 왼쪽, 가운데, 오른쪽을 클릭하세요!";
    }

    function shoot(direction) {
        if (!gameStarted) {
            messageElement.innerText =
                "먼저 게임 시작 버튼을 눌러주세요!";

            return;
        }

        if (!ballSelected) {
            messageElement.innerText =
                "먼저 축구공을 클릭하세요!";

            return;
        }

        if (isShooting) {
            return;
        }

        isShooting = true;

        const directions = [
            "left",
            "center",
            "right"
        ];

        const keeperDirection =
            directions[
                Math.floor(Math.random() * directions.length)
            ];

        goalkeeper.className =
            "goalkeeper keeper-" + keeperDirection;

        ball.className =
            "ball shoot-" + direction;

        setTimeout(function () {
            if (direction === keeperDirection) {
                life--;

                lifeElement.innerText = life;

                messageElement.innerText =
                    "🧤 골키퍼가 몸을 날려 막았습니다!";

                showSaveEffect();
            } else {
                score++;

                scoreElement.innerText = score;

                messageElement.innerText =
                    "⚽ 골입니다! 멋진 슛이에요!";

                showGoalEffect();

                if (score > bestScore) {
                    bestScore = score;

                    bestScoreElement.innerText =
                        bestScore;

                    localStorage.setItem(
                        "soccerBestScore",
                        bestScore
                    );
                }
            }

            if (life <= 0) {
                endGame();
                return;
            }

            setTimeout(function () {
                resetPosition();

                messageElement.innerText =
                    "다시 공을 클릭하고 슛 방향을 선택하세요!!!";
            }, 900);

        }, 650);
    }

    function resetPosition() {
        ball.className = "ball";

        goalkeeper.className =
            "goalkeeper keeper-center";

        ballSelected = false;
        isShooting = false;
    }

    function showGoalEffect() {
        const goalText =
            document.createElement("div");

        goalText.className = "goal-text";
        goalText.innerText = "GOAL!";

        document.body.appendChild(goalText);

        setTimeout(function () {
            goalText.remove();
        }, 1200);
    }

    function showSaveEffect() {
        const saveText =
            document.createElement("div");

        saveText.className = "save-text";
        saveText.innerText = "SAVE!";

        document.body.appendChild(saveText);

        setTimeout(function () {
            saveText.remove();
        }, 1000);
    }

    function endGame() {
        gameStarted = false;
        ballSelected = false;
        isShooting = false;

        messageElement.innerText =
            "🏁 게임 종료! 최종 점수는 "
            + score
            + "점입니다.";

        startButton.disabled = false;
        startButton.innerText = "▶ 다시 시작";
    }

    function resetGame() {
        score = 0;
        life = 5;

        gameStarted = false;
        ballSelected = false;
        isShooting = false;

        scoreElement.innerText = score;
        lifeElement.innerText = life;

        messageElement.innerText =
            "게임 시작 버튼을 눌러주세요!";

        startButton.disabled = false;
        startButton.innerText = "▶ 게임 시작";

        resetPosition();
    }
</script>

</body>
